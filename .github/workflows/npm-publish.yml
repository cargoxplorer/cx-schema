name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like c, v1.2.3, etc.

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Auth via npm trusted publishing (OIDC) — no NPM_TOKEN secret. The token-based
      # publish had been failing with EOTP (2FA one-time password) since May 2026.
      # Requires npm >= 11.5.1 and a trusted publisher configured on npmjs.com for
      # BOTH packages (@cxtms/cx-schema and cxtms): repo cargoxplorer/cx-schema,
      # workflow npm-publish.yml.
      - name: Update npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish @cxtms/cx-schema to npm
        run: npm publish --provenance --access public

      - name: Rename package to cxtms
        run: npm pkg set name=cxtms

      - name: Publish cxtms to npm
        run: npm publish --provenance --access public
