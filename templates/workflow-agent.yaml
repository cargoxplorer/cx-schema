# {{displayName}} Agent
# Generated by cxtms create workflow --template agent

workflow:
  workflowId: "{{uuid}}"
  name: "{{displayName}}"
  description: "{{displayName}} - AI agent"
  version: "1.0"
  workflowType: Agent
  executionMode: Sync
  logLevel: Information
  isActive: true
  enableAudit: true
  filePath: "{{fileName}}"

agent:
  description: "Describe what this agent does, for callers and other agents."
  instructions: |
    You are an operations analyst for this organization.
    Load the order with the tool first, then reason about it.
    When you have a decision, call set_result with { action, reason }.
  model:
    fromConfig: "ai.default"
    # contextWindow: 200000  # set when overriding model.name below: the org config's window describes its own model, not this one
  session:
    type: task
    maxTurns: 20
    timeout: 300
  result:
    type: object
    required: [action, reason]
    properties:
      action: { type: string }
      reason: { type: string }
  tools:
    - workflow: "MCP / Get Order Status"
      instructions: "Call first to load the order before reasoning."
    - workflow: "MCP / Cancel Shipment"
      instructions: "Cancels the order's shipment. Side-effecting — waits for a person to approve."
      mode: approval

# Outputs are fixed for Agent workflows: result (set_result argument), transcript, sessionId. No outputs: section is needed.
inputs:
  - name: orderNumber
    type: string
    props:
      required: true
      description: "The order to work on"
