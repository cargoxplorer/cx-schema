# {{displayName}} MCP Resource Workflow
# Generated by cxtms create workflow --template mcp-resource
# Served to AI agents on the org MCP server at /public-api/v1/{orgUniqueId}/mcp

mcp:
  uri: "tms://docs/{{name}}"
  name: "{{displayName}}"
  description: "{{displayName}} - reference content for AI agents"
  mimeType: "text/markdown"
  timeout: 60

workflow:
  workflowId: "{{uuid}}"
  name: "{{displayName}}"
  description: "{{displayName}} - MCP resource workflow"
  version: "1.0"
  workflowType: McpResource
  executionMode: Sync   # Required: MCP resources must be Sync
  logLevel: Information
  isActive: true
  enableAudit: true
  filePath: "{{fileName}}"
  tags:
    - "mcp-resource"

outputs:
  - name: response
    mapping: "Main.SetContent.content"

activities:
  - name: Main
    events:
      onActivityFailed:
        - task: "Utilities/Log@1"
          name: LogActivityFailed
          inputs:
            message: "Activity Main failed: {{exception.message}}"
            level: Error
    steps:
      # TODO: Replace with your content — static markdown, or query live data
      # (string response + text/* mimeType is returned to the AI as-is;
      #  non-string responses are JSON-serialized)
      - task: "Utilities/SetVariable@1"
        name: SetContent
        inputs:
          variables:
            - name: content
              value: |
                # {{displayName}}

                Add your reference content here. This markdown is returned
                to AI agents that read the resource.

events:
  onWorkflowFailed:
    - task: "Utilities/Log@1"
      name: LogWorkflowFailed
      inputs:
        message: "{{displayName}} workflow failed: {{exception.message}}"
        level: Error
