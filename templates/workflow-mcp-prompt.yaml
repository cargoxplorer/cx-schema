# {{displayName}} MCP Prompt Workflow
# Generated by cxtms create workflow --template mcp-prompt
# Served to AI agents on the org MCP server at /public-api/v1/{orgUniqueId}/mcp

mcp:
  name: "{{name}}"
  title: "{{displayName}}"
  description: "Prompt template for {{displayName}}. Guides the AI through a task using the provided arguments."
  timeout: 60

workflow:
  workflowId: "{{uuid}}"
  name: "{{displayName}}"
  description: "{{displayName}} - MCP prompt workflow"
  version: "1.0"
  workflowType: McpPrompt
  executionMode: Sync   # Required: MCP prompts must be Sync
  logLevel: Information
  isActive: true
  enableAudit: true
  filePath: "{{fileName}}"
  tags:
    - "mcp-prompt"

# Prompt arguments (MCP prompt argument values are always strings)
inputs:
  - name: orderNumber
    type: string
    props:
      description: "The order number to analyze"
      required: true

# The 'messages' output is a list of { role: user|assistant, text: "..." }.
# Alternatively, output a plain string named 'response' for a single user message.
outputs:
  - name: messages
    mapping: "Main.BuildMessages.messages"

activities:
  - name: Main
    events:
      onActivityFailed:
        - task: "Utilities/Log@1"
          name: LogActivityFailed
          inputs:
            message: "Activity Main failed: {{exception.message}}"
            level: Error
    steps:
      # TODO: Optionally query live data here to enrich the prompt

      - task: "Utilities/SetVariable@1"
        name: BuildMessages
        inputs:
          variables:
            - name: messages
              value:
                - role: user
                  text: |
                    Analyze order \{{inputs.orderNumber}}.

                    Check the order's status, dates, and tracking events, then
                    summarize anything that needs attention.

events:
  onWorkflowFailed:
    - task: "Utilities/Log@1"
      name: LogWorkflowFailed
      inputs:
        message: "{{displayName}} workflow failed: {{exception.message}}"
        level: Error
