# {{displayName}} MCP Tool Workflow
# Generated by cxtms create workflow --template mcp-tool
# Served to AI agents on the org MCP server at /public-api/v1/{orgUniqueId}/mcp

mcp:
  name: "{{name}}"
  description: "Use this tool to {{displayName}}. Takes an order ID and returns the processing outcome."
  timeout: 60

workflow:
  workflowId: "{{uuid}}"
  name: "{{displayName}}"
  description: "{{displayName}} - MCP tool workflow"
  version: "1.0"
  workflowType: McpTool
  executionMode: Sync   # Required: MCP tools must be Sync
  logLevel: Information
  isActive: true
  enableAudit: true
  filePath: "{{fileName}}"
  tags:
    - "mcp-tool"

inputs:
  - name: orderId
    type: number
    props:
      description: "The ID of the order to process"
      required: true

outputs:
  - name: response
    mapping: "Main.SetResult.result"

activities:
  - name: Main
    events:
      onActivityStarted:
        - task: "Utilities/Log@1"
          name: LogActivityStarted
          inputs:
            message: "Activity Main started"
            level: Information
      onActivityCompleted:
        - task: "Utilities/Log@1"
          name: LogActivityCompleted
          inputs:
            message: "Activity Main completed"
            level: Information
      onActivityFailed:
        - task: "Utilities/Log@1"
          name: LogActivityFailed
          inputs:
            message: "Activity Main failed: {{exception.message}}"
            level: Error
    steps:
      - task: "Query/GraphQL"
        name: GetOrder
        inputs:
          query: |
            query($organizationId: Int!, $orderId: Int!) {
              order(organizationId: $organizationId, orderId: $orderId) {
                orderId
                orderNumber
                status
              }
            }
          variables:
            organizationId: "\{{int organizationId}}"
            orderId: "\{{inputs.orderId}}"
        outputs:
          - name: order
            mapping: "order?"

      - task: "Utilities/Error@1"
        name: ValidateOrder
        conditions:
          - expression: "isNullOrEmpty([Main?.GetOrder?.order?]) = true"
        inputs:
          message: "Order not found: \{{inputs.orderId}}"

      # TODO: Add processing logic here

      - task: "Utilities/SetVariable@1"
        name: SetResult
        inputs:
          variables:
            - name: result
              value:
                success: true
                orderId: "\{{inputs.orderId}}"
                orderNumber: "\{{Main?.GetOrder?.order?.orderNumber?}}"

events:
  onWorkflowStarted:
    - task: "Utilities/Log@1"
      name: LogWorkflowStarted
      inputs:
        message: "{{displayName}} workflow started"
        level: Information
  onWorkflowCompleted:
    - task: "Utilities/Log@1"
      name: LogWorkflowCompleted
      inputs:
        message: "{{displayName}} workflow completed successfully"
        level: Information
  onWorkflowFailed:
    - task: "Utilities/Log@1"
      name: LogWorkflowFailed
      inputs:
        message: "{{displayName}} workflow failed: {{exception.message}}"
        level: Error
